<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d1a">
  <title>MoneyManager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="top-bar">
      <div class="top-bar-left">
        <button class="btn-month" id="btnPrevMonth">‹</button>
        <span class="month-label" id="monthLabel">2026年5月</span>
        <button class="btn-month" id="btnNextMonth">›</button>
      </div>
      <div class="top-bar-right">
        <span class="month-expense-label">支出</span>
        <span class="month-expense-value" id="monthExpense">¥0.00</span>
      </div>
      <button class="btn-top-review" id="btnTopReview">月度复盘</button>
    </header>

    <main class="main-content">
      <div class="page-wrapper" id="pageWrapper">

      <div class="page-left">
      <section class="form-section" id="formSection">
        <div class="amount-group">
          <span class="currency-sign">¥</span>
          <input type="number" id="inputAmount" class="amount-input" placeholder="0.00" step="0.01" min="0" inputmode="decimal" autocomplete="off" name="amount" form="dummy-form" autofocus>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
        <div class="form-row">
          <div class="form-field">
            <div class="date-trigger" id="dateTrigger">
              <span class="date-trigger-value" id="dateDisplay"></span>
              <svg class="date-trigger-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
          </div>
          <div class="form-field">
            <input type="text" id="inputNote" class="form-input" placeholder="备注" maxlength="20">
          </div>
        </div>
        <button id="btnSubmit" class="btn-primary">记一笔</button>
        <div class="form-actions">
          <label class="toggle">
            <input type="checkbox" id="advanceToggle">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-label">垫付</span>
          </label>
          <button id="btnQuickEntry" class="btn-secondary">快速记账</button>
        </div>
      </section>

      <section class="list-section" id="listSection">
        <div class="today-budget-bar" id="todayBudgetBar">
          <div class="today-budget-left">
            <span class="today-budget-label">当日可用</span>
            <span class="today-budget-value" id="todayBudgetValue">¥0.00</span>
          </div>
          <div class="today-budget-right">
            <span class="today-budget-spent-label">当日已花</span>
            <span class="today-budget-spent-value" id="todayBudgetSpent">¥0.00</span>
          </div>
          <div class="today-budget-status" id="todayBudgetStatus"></div>
        </div>
        <div class="list-header">
          <span class="list-title" id="listTitle">今天</span>
          <div class="list-header-right">
            <span class="list-count" id="listCount">0 笔</span>
            <span class="list-day-expense" id="listDayExpense"></span>
            <button class="btn-ghost" id="btnSelectMode">选择</button>
          </div>
        </div>
        <div class="list-body" id="listBody">
          <div class="empty-list">还没有记录</div>
        </div>
      </section>
      </div>

      <div class="page-right">
      <section class="review-section" id="reviewSection" style="display:none">
        <div class="review-card collapsible" id="budgetOverviewCard">
          <div class="review-card-header" id="budgetOverviewToggle">
            <span class="review-card-title">月度预算</span>
            <button class="btn-ghost" id="btnBudgetEdit">设置</button>
          </div>
          <div class="review-card-body" id="budgetOverviewBody">
            <div class="budget-summary-row">
              <div class="budget-summary-col">
                <span class="budget-summary-label">预算</span>
                <span class="budget-summary-value" id="budgetAmount">¥0.00</span>
              </div>
              <div class="budget-summary-col">
                <span class="budget-summary-label">已花</span>
                <span class="budget-summary-value" id="budgetSpent">¥0.00</span>
              </div>
              <div class="budget-summary-col">
                <span class="budget-summary-label">剩余</span>
                <span class="budget-summary-value" id="budgetRemaining">¥0.00</span>
              </div>
            </div>
            <div class="budget-progress">
              <div class="budget-progress-bar" id="budgetProgressBar"></div>
            </div>
            <div class="budget-today-row">
              <span class="budget-today-label">当日可用</span>
              <span class="budget-today-value" id="budgetTodayValue">¥0.00</span>
              <span class="budget-today-status" id="budgetTodayStatus"></span>
            </div>
            <div class="budget-target" id="budgetTarget" style="display:none">
              <span class="budget-target-label">目标：</span>
              <span class="budget-target-value" id="budgetTargetValue"></span>
            </div>
          </div>
        </div>

        <div class="review-card collapsible">
          <div class="review-card-header" id="dayBudgetToggle">
            <span class="review-card-title">每日预算追踪</span>
          </div>
          <div class="review-card-body" id="dayBudgetSection" style="display:none">
            <div class="day-budget-list" id="dayBudgetList"></div>
          </div>
        </div>

        <div class="review-card">
          <div class="review-card-header">
            <span class="review-card-title">支出统计</span>
          </div>
          <div class="review-card-body">
            <div class="review-summary-grid">
              <div class="review-summary-item">
                <span class="review-summary-label">总支出</span>
                <span class="review-summary-value" id="reviewTotal">¥0.00</span>
              </div>
              <div class="review-summary-item">
                <span class="review-summary-label">日均</span>
                <span class="review-summary-value" id="reviewDailyAvg">¥0.00</span>
              </div>
              <div class="review-summary-item">
                <span class="review-summary-label">总笔数</span>
                <span class="review-summary-value" id="reviewCount">0</span>
              </div>
              <div class="review-summary-item">
                <span class="review-summary-label">单笔最高</span>
                <span class="review-summary-value" id="reviewMax">¥0.00</span>
              </div>
            </div>
          </div>
        </div>

        <div class="review-card">
          <div class="review-card-header">
            <span class="review-card-title">分类分析</span>
          </div>
          <div class="review-card-body">
            <div class="review-rank" id="reviewRank"></div>
          </div>
        </div>

        <div class="review-category-detail" id="reviewCategoryDetail" style="display:none">
          <div class="review-card-header">
            <button class="btn-ghost" id="btnCategoryBack">返回</button>
            <span class="review-card-title" id="reviewCategoryTitle">餐饮</span>
            <span class="review-card-count" id="reviewCategoryCount">0 笔</span>
          </div>
          <div class="review-card-body">
            <div class="trend-section" id="trendSection">
              <span class="trend-title">近6月趋势</span>
              <canvas class="trend-canvas" id="trendCanvas" width="600" height="200"></canvas>
            </div>
            <div class="review-category-detail-list" id="reviewCategoryList"></div>
          </div>
        </div>

        <div class="review-card">
          <div class="review-card-header">
            <span class="review-card-title">月度小结</span>
          </div>
          <div class="review-card-body">
            <textarea class="review-memo-input" id="memoInput" placeholder="这个月花了哪些不该花的钱？下个月有什么预算计划？写下你的思考..." maxlength="500"></textarea>
            <div class="review-memo-footer">
              <span class="review-memo-count" id="memoCount">0/500</span>
            </div>
          </div>
        </div>

        <div class="review-footer">
          <button class="btn-ghost" id="btnDataMgmt">数据管理</button>
        </div>
      </section>

      </div>

    </main>

    <div class="batch-bar" id="batchBar" style="display:none">
      <span class="batch-bar-count" id="batchCount">已选 0 笔</span>
      <div class="batch-bar-actions">
        <button class="btn-batch" id="btnBatchInvert">反选</button>
        <button class="btn-batch" id="btnBatchCategory">分类</button>
        <button class="btn-batch" id="btnBatchDate">日期</button>
        <button class="btn-batch btn-danger" id="btnBatchDelete">删除</button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="quickOverlay" style="display:none">
    <div class="panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span class="panel-title">快速记账</span>
        <button class="panel-close" id="btnQuickClose">×</button>
      </div>
      <div class="panel-body">
        <div class="quick-panel-amount">
          <span class="currency-sign">¥</span>
          <span class="quick-amount-display" id="quickAmountDisplay">0.00</span>
        </div>
        <div class="quick-category-grid" id="quickCategoryGrid"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="editOverlay" style="display:none">
    <div class="panel" id="editPanel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span class="panel-title" id="editPanelTitle">编辑账单</span>
      </div>
      <div class="panel-body">
        <div class="edit-field-group">
          <div class="amount-group">
            <span class="currency-sign">¥</span>
            <input type="number" id="editAmount" class="amount-input" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
          </div>
        </div>
        <div class="category-grid" id="editCategoryGrid"></div>
        <div class="subtype-group" id="editSubTypeGroup">
          <button class="subtype-btn selected" data-subtype="expense">支出</button>
          <button class="subtype-btn" data-subtype="refund">退款</button>
          <button class="subtype-btn" data-subtype="advance">垫付</button>
        </div>
        <div class="edit-field-group">
          <div class="form-row">
            <div class="form-field">
              <div class="date-trigger" id="editDateTrigger">
                <span class="date-trigger-value" id="editDateDisplay"></span>
                <svg class="date-trigger-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </div>
            </div>
            <div class="form-field">
              <input type="text" id="editNote" class="form-input" placeholder="备注" maxlength="20">
            </div>
          </div>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn-ghost" id="btnEditDelete">删除</button>
        <button class="btn-primary" id="btnEditSave">保存</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="dataOverlay" style="display:none">
    <div class="panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span class="panel-title">数据管理</span>
      </div>
      <div class="panel-body">
        <div class="data-summary" id="dataSummary">
          <span class="data-summary-label">累计支出</span>
          <span class="data-summary-value" id="dataTotalExpense">¥0.00</span>
        </div>
        <div class="data-actions">
          <button class="data-action-btn" id="btnClearMonth">
            <div class="data-action-content">
              <span class="data-action-title">清除本月数据</span>
              <span class="data-action-desc" id="clearMonthDesc">删除当月所有账单</span>
            </div>
          </button>
          <button class="data-action-btn danger" id="btnClearAll">
            <div class="data-action-content">
              <span class="data-action-title">清除所有数据</span>
              <span class="data-action-desc">删除全部账单，无法恢复</span>
            </div>
          </button>
          <button class="data-action-btn" id="btnTheme">
            <div class="data-action-content">
              <span class="data-action-title">主题设置</span>
              <span class="data-action-desc">自定义应用外观颜色</span>
            </div>
          </button>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn-ghost" id="btnDataCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="budgetOverlay" style="display:none">
    <div class="panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span class="panel-title">设置预算</span>
        <button class="panel-close" id="btnBudgetClose">×</button>
      </div>
      <div class="panel-body">
        <div class="budget-form-group">
          <label class="budget-form-label">预算金额</label>
          <div class="budget-input-group">
            <span class="budget-input-prefix">¥</span>
            <input type="number" id="inputBudgetAmount" class="budget-input" placeholder="留空则不设置预算" step="0.01" min="0">
          </div>
        </div>
        <div class="budget-form-group">
          <label class="budget-form-label">预算目标（选填）</label>
          <input type="text" id="inputBudgetTarget" class="budget-input budget-input-full" placeholder="如：攒钱买iPhone" maxlength="50">
        </div>
        <div class="budget-form-group">
          <label class="budget-form-label">工作模式</label>
          <div class="budget-workmode-group">
            <label class="budget-workmode-option">
              <input type="radio" name="workMode" value="double" checked>
              <span class="budget-workmode-radio"></span>
              <span class="budget-workmode-text">双休（周六、周日休息）</span>
            </label>
            <label class="budget-workmode-option">
              <input type="radio" name="workMode" value="single">
              <span class="budget-workmode-radio"></span>
              <span class="budget-workmode-text">单休（仅周日休息）</span>
            </label>
          </div>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn-ghost" id="btnBudgetDelete" style="display:none">删除</button>
        <button class="btn-primary" id="btnBudgetSave">保存</button>
      </div>
    </div>
  </div>

  <div class="overlay panel-modal" id="calendarOverlay" style="display:none">
    <div class="panel calendar-panel">
      <div class="panel-header">
        <button class="btn-icon" id="calPrevMonth">‹</button>
        <span class="panel-title" id="calTitle"></span>
        <button class="btn-icon" id="calNextMonth">›</button>
      </div>
      <div class="panel-body">
        <div class="cal-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="panel-actions">
        <button class="btn-secondary" id="calToday">今天</button>
        <button class="btn-primary" id="calConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="themeOverlay" style="display:none">
    <div class="panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span class="panel-title">主题设置</span>
      </div>
      <div class="panel-body">
        <div class="theme-section-title">预设主题</div>
        <div class="theme-presets" id="themePresets"></div>
        <div class="theme-section-title">自定义颜色</div>
        <div class="theme-custom">
        <label class="theme-color-btn" id="themeAccentBtn">
          <span class="theme-color-label">主题色</span>
          <input type="color" id="themeAccent" value="#5a5aff">
        </label>
        <label class="theme-color-btn" id="themeBgBtn">
          <span class="theme-color-label">背景色</span>
          <input type="color" id="themeBg" value="#0d0d1a">
        </label>
        <label class="theme-color-btn" id="themeExpenseBtn">
          <span class="theme-color-label">支出色</span>
          <input type="color" id="themeExpense" value="#ff4757">
        </label>
        <label class="theme-color-btn" id="themeIncomeBtn">
          <span class="theme-color-label">收入色</span>
          <input type="color" id="themeIncome" value="#2ecc71">
        </label>
      </div>
        <div class="theme-custom-preview" id="themeCustomPreview" style="display:none"></div>
      </div>
      <div class="panel-actions">
        <button class="btn-ghost" id="btnThemeClose">取消</button>
        <button class="btn-primary" id="btnThemeApply">应用</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
