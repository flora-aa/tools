<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .search-box {
      text-align: center;
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      outline: none;
    }

    .group {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .group-title {
      color: #333;
      font-size: 1.4em;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid #667eea;
    }

    .link-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .link-item {
      display: block;
      padding: 15px 20px;
      background: #f8f9fa;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: center;
    }

    .link-item:hover {
      background: #667eea;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .empty-message {
      color: #666;
      text-align: center;
      padding: 20px;
    }
  </style>

  <script>
    /* ==================== 配置说明 ==================== */
    /* 请修改下方 CONFIG 对象中的配置                     */
    /* ================================================ */
    const CONFIG = {
      title: '我的导航',
      basePath: '/tools',
      groups: [
        {
          title: 'me',
          items: [
            { name: 'MonthlyMoneyManager', path: 'MoneyManager' }
          ]
        }
      ]
    };
    /* ================================================ */

    function generateLinks() {
      const container = document.getElementById('content');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();

      container.innerHTML = '';

      let hasResults = false;

      CONFIG.groups.forEach(group => {
        const filteredItems = group.items.filter(item =>
          item.name.toLowerCase().includes(searchQuery)
        );

        if (filteredItems.length === 0) return;

        hasResults = true;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';

        const title = document.createElement('h2');
        title.className = 'group-title';
        title.textContent = group.title;
        groupDiv.appendChild(title);

        const linkList = document.createElement('div');
        linkList.className = 'link-list';

        filteredItems.forEach(item => {
          const link = document.createElement('a');
          link.className = 'link-item';
          link.href = `${CONFIG.basePath}/${item.path}/`;
          link.textContent = item.name;
          link.target = '_blank';
          linkList.appendChild(link);
        });

        groupDiv.appendChild(linkList);
        container.appendChild(groupDiv);
      });

      if (!hasResults) {
        container.innerHTML = '<p class="empty-message">没有找到匹配的项目</p>';
      }
    }

    function init() {
      document.getElementById('pageTitle').textContent = CONFIG.title;
      document.getElementById('searchInput').addEventListener('input', generateLinks);
      generateLinks();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="container">
    <h1 id="pageTitle">导航页面</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索项目...">
    </div>

    <div id="content"></div>
  </div>
</body>
</html>
